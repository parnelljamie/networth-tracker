name: Feature request
description: Suggest something Waymark could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or question you have, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
